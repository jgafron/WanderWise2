<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MusicBook</title>
    <style>
        /* Reset default margins and paddings for all elements */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Body styling to center content */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        }

        /* Container for the main content */
        .container {
            text-align: center; 
            background: #fff; 
            padding: 40px;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px; 
            width: 100%;
        }

        /* Main heading */
        h1 {
            font-size: 3rem;
            color: #4CAF50; 
        }

        /* Paragraph styling */
        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 40px;
        }

        /* Button-like link styling */
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        /* Change button color on hover */
        .btn:hover {
            background-color: #45a049;
        }

        /* Footer styling */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #aaa;
        }

        /* Footer links */
        footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        /* Add underline to links on hover */
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Main content container -->
    <div class="container">
        <h1>Welcome to MusicBook!</h1>
        <p>Your personal space for discovering, sharing, and enjoying music.</p>
        
        <!-- Links to navigate to other pages -->
        <p><a href="{{ url_for('EntriesPage') }}">Current Entries!</a></p>
        <p><a href="{{ url_for('addEntryPage') }}">Add an entry!</a></p>
    </div>

    
    <footer>
        <p>&copy; 2025 MusicBook | <a href="#">Privacy Policy</a></p>
    </footer>
</body>
</html>
