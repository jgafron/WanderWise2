<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicBook - Add New Song Entry</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
        }
        .form-card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-card h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-card .form-group label {
            font-weight: bold;
        }
        .form-card .form-control {
            border-radius: 4px;
        }
        .form-card .btn {
            width: 100%;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2>Add New Song Entry</h2>
            <form action="/addentry" method="POST">
                <!-- Song Title -->
                <div class="form-group">
                    <label for="song_title">Song Title</label>
                    <input type="text" class="form-control" id="song_title" name="song_title" required>
                </div>

                <!-- Genre -->
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" class="form-control" id="genre" name="genre" required>
                </div>

                <!-- Artist (Performer) -->
                <div class="form-group">
                    <label for="artist">Artist (Performed by)</label>
                    <input type="text" class="form-control" id="artist" name="artist" required>
                </div>

                <!-- Release Date -->
                <div class="form-group">
                    <label for="release_date">Release Date</label>
                    <input type="month" class="form-control" id="release_date" name="release_date" required>
                </div>

                <!-- Song Lyrics -->
                <div class="form-group">
                    <label for="lyrics">Song Lyrics</label>
                    <textarea class="form-control" id="lyrics" name="lyrics" rows="4"></textarea>
                </div>

                <!-- Rating -->
                <div class="form-group">
                    <label for="rating">Song Rating (1 to 5)</label>
                    <input type="number" class="form-control" id="rating" name="rating" min="1" max="5" step="0.1" required>
                </div>

                <!-- URL -->
                <div class="form-group">
                    <label for="url">Song URL (on music service)</label>
                    <input type="url" class="form-control" id="url" name="url">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Add Song</button>
            </form>
        </div>
    </div>

    <!-- Script Links -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
