<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Travel Dates</title>
    <link rel="stylesheet" href="assets/css/selectdates.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"> <!-- Flatpickr Styles -->
</head>
<body>

    <div class="sidebar">
    <div class="airplane">
        <img src="assets/img/airplane2.png" alt="Airplane Image">
    </div>
    <h2 class="app-name">WanderWise</h2> 
    <ul class="menu">
        <li><a href="/plan" id="home-btn">Home</a></li>
        <li><a href="/trips" id="my-trip-btn">My Trips</a></li>
        <li><a href="/createtrip" id="create-trip-btn">Create a Trip</a></li>
    </ul>
    <div class="user-info-container" id="user-info-container">
        <img id="user-profile-pic" class="user-profile-pic" src="https://via.placeholder.com/40" alt="User Image">
        <span id="user-email" class="user-email">User Email</span>
        <button id="sign-out-btn" class="sign-out-btn">Sign Out</button>
    </div>
    </div>
    <div class="form-container">
        <h2>Select Your Travel Dates</h2>

        <p id="selected-hotel">Loading hotel info...</p>
        
        <!-- Form for Handling Submission -->
        <form id="date-form">
            <div class="search-container">
                <input type="text" id="date-range" placeholder="Choose your dates..." readonly required>
            </div>

            <!-- Submit Button (Disabled Until Dates Are Selected) -->
            <button type="submit" id="continue-btn" disabled>Save & Continue →</button>
        </form>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script> <!-- Flatpickr JS -->
    <script src="assets/js/selectdates.js"></script>
</body>
</html>
