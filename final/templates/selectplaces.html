<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Attractions</title>
    <link rel="stylesheet" href="assets/css/selectplaces.css"> <!-- Custom Styles -->
</head>
<body>

    <!-- Sidebar Navigation (Copied from other pages) -->
    <div class="sidebar">
        <div class="airplane">
            <img src="assets/img/airplane2.png" alt="Airplane Image">
        </div>
        <h2 class="app-name">WanderWise</h2> 
        <ul class="menu">
            <li><a href="/plan" id="home-btn">Home</a></li>
            <li><a href="/trips" id="my-trip-btn">My Trips</a></li>
            <li><a href="/createtrip" id="create-trip-btn">Create a Trip</a></li>
        </ul>
        <div class="user-info-container" id="user-info-container">
            <img id="user-profile-pic" class="user-profile-pic" src="https://via.placeholder.com/40" alt="User Image">
            <span id="user-email" class="user-email">User Email</span>
            <button id="sign-out-btn" class="sign-out-btn">Sign Out</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="container">
            <h2>Explore & Select Your Activities</h2>

            <!-- Tabs for Categories -->
            <div class="tab-container">
                <button class="tab-button active" data-category="attractions">Attractions</button>
                <button class="tab-button" data-category="food">Food & Drinks</button>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for places...">
                <button id="search-btn">🔍</button>
            </div>

            <!-- API Results Container -->
            <div id="results-container">
                <p>Loading attractions...</p> <!-- Placeholder while fetching API -->
            </div>
            
            <!-- Floating "Next" Button -->
            <button id="next-btn" disabled>Next →</button>
        </div>
    </div>

    <!-- Selected Places Sidebar -->
    <div id="selected-places-sidebar">
        <h2>Selected Places</h2>
        <div id="selected-places-list"></div>
    </div>

    
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/selectplaces.js"></script>
</body>
</html>
