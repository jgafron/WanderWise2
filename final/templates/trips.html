<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - WanderWise</title>
    <link rel="stylesheet" href="assets/css/trips.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="airplane">
            <img src="assets/img/airplane2.png" alt="Airplane Image">
        </div>
        <h2 class="app-name">WanderWise</h2> 
        <ul class="menu">
            <li><a href="#" id="home-btn">Home</a></li>
            <li><a href="#" id="my-trip-btn">My Trips</a></li>
            <li><a href="#" id="create-trip-btn">Create a Trip</a></li>
        </ul>
        <div class="user-info-container" id="user-info-container">
            <img id="user-profile-pic" class="user-profile-pic" src="https://via.placeholder.com/40" alt="User Image">
            <span id="user-email" class="user-email">User Email</span>
            <button id="sign-out-btn" class="sign-out-btn">Sign Out</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1 class="page-title">My Trips</h1>
        <p class="subtitle">Explore and manage your saved itineraries.</p>

        <!-- Container for Trips -->
        <div class="trip-container" id="trip-list">
            <p>Loading your saved trips...</p>
        </div>
    </div>

    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/mytrips.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
